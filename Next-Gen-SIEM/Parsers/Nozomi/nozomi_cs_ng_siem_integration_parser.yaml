name: Nozomi
fieldsToBeRemovedBeforeParsing: []
$schema: https://schemas.humio.com/parser/v0.3.0
script: |-
  // ============================================================================
  // Nozomi Parser for CrowdStrike NG-SIEM
  // Supports:
  // - nozomi.alert
  // - nozomi.asset
  // - nozomi.node
  // - nozomi.vulnerability
  //
  // Input format:
  // HEC / HTTP Event Connector envelope:
  // {
  //   "time": 1766416880.813,
  //   "host": "guardian.example.local",
  //   "source": "nozomi.alert",
  //   "event": {
  //     "event": {...},
  //     "observer": {...},
  //     "host": {...},
  //     "rule": {...},
  //     "network": {...},
  //     "vulnerability": {...},
  //     "related": {...},
  //     "nozomi": {...}
  //   }
  // }
  // ============================================================================
  
  
  // ============================================================================
  // PREPARSE
  // ============================================================================
  
  parseJson(field="@rawstring", prefix="Vendor.", excludeEmpty="true", handleNull="discard")
  
  // Do NOT override @timestamp from event.created/nozomi.time here.
  // The HEC envelope top-level `time` should control event time.
  // This avoids hiding newly ingested events in old historical ranges.
  
  
  // ============================================================================
  // STATIC CPS METADATA
  // ============================================================================
  
  | Parser.version := "1.1.0"
  | Vendor := "nozomi"
  | ecs.version := "8.11.0"
  | Cps.version := "1.0.0"
  
  | event.module := "nozomi"
  | observer.type := "ndr"
  
  
  // ============================================================================
  // COMMON HEC / PAYLOAD FIELDS
  // ============================================================================
  
  // HEC metadata
  | Vendor.hec_time := Vendor.time
  | Vendor.hec_host := Vendor.host
  | Vendor.hec_source := Vendor.source
  
  // Dataset / kind from nested Nozomi payload
  | event.dataset := Vendor.event.event.dataset
  | event.kind := Vendor.event.event.kind
  | event.id := Vendor.event.nozomi.id
  | event.created := Vendor.event.event.created
  | event.severity := Vendor.event.event.severity
  
  
  // Observer
  | observer.vendor := Vendor.event.observer.vendor
  | observer.product := Vendor.event.observer.product
  | observer.type := Vendor.event.observer.type
  | observer.hostname := Vendor.event.observer.hostname
  
  // If observer.hostname is missing, use HEC top-level host.
  | case {
      observer.hostname = * |
        observer.hostname := observer.hostname;
  
      Vendor.hec_host = * |
        observer.hostname := Vendor.hec_host;
  
      * |
        observer.hostname := "unknown"
    }
  
  | lower(observer.hostname)
  
  
  // ============================================================================
  // ALERTS
  // ============================================================================
  
  | case {
      event.dataset = "nozomi.alert" |
  
        event.kind := "alert"
        | event.category[0] := "intrusion_detection"
        | event.type[0] := "indicator"
        | event.action := Vendor.event.event.action
        | event.outcome := Vendor.event.event.outcome
  
        // Defaults if not provided by the Nozomi source
        | case {
            event.outcome = "success" |
              event.outcome := "success";
  
            event.outcome = "failure" |
              event.outcome := "failure";
  
            * |
              event.outcome := "unknown"
          }
  
        // Rule
        | rule.id := Vendor.event.rule.id
        | rule.name := Vendor.event.rule.name
        | rule.description := Vendor.event.rule.description
  
        // Source: prefer normalized source object, fallback to nozomi raw fields
        | source.ip := Vendor.event.source.ip
        | source.mac := Vendor.event.source.mac
        | source.port := Vendor.event.source.port
        | source.zone := Vendor.event.source.zone
  
        | case {
            source.ip = * |
              source.ip := source.ip;
  
            Vendor.event.nozomi.ip_src = * |
              source.ip := Vendor.event.nozomi.ip_src;
  
            * |
              source.ip := source.ip
          }
  
        | case {
            source.mac = * |
              source.mac := source.mac;
  
            Vendor.event.nozomi.mac_src = * |
              source.mac := Vendor.event.nozomi.mac_src;
  
            * |
              source.mac := source.mac
          }
  
        | case {
            source.port = * |
              source.port := source.port;
  
            Vendor.event.nozomi.port_src = * |
              source.port := Vendor.event.nozomi.port_src;
  
            * |
              source.port := source.port
          }
  
        | case {
            source.zone = * |
              source.zone := source.zone;
  
            Vendor.event.nozomi.zone_src = * |
              source.zone := Vendor.event.nozomi.zone_src;
  
            * |
              source.zone := source.zone
          }
  
        // Destination: prefer normalized destination object, fallback to nozomi raw fields
        | destination.ip := Vendor.event.destination.ip
        | destination.mac := Vendor.event.destination.mac
        | destination.port := Vendor.event.destination.port
        | destination.zone := Vendor.event.destination.zone
  
        | case {
            destination.ip = * |
              destination.ip := destination.ip;
  
            Vendor.event.nozomi.ip_dst = * |
              destination.ip := Vendor.event.nozomi.ip_dst;
  
            * |
              destination.ip := destination.ip
          }
  
        | case {
            destination.mac = * |
              destination.mac := destination.mac;
  
            Vendor.event.nozomi.mac_dst = * |
              destination.mac := Vendor.event.nozomi.mac_dst;
  
            * |
              destination.mac := destination.mac
          }
  
        | case {
            destination.port = * |
              destination.port := destination.port;
  
            Vendor.event.nozomi.port_dst = * |
              destination.port := Vendor.event.nozomi.port_dst;
  
            * |
              destination.port := destination.port
          }
  
        | case {
            destination.zone = * |
              destination.zone := destination.zone;
  
            Vendor.event.nozomi.zone_dst = * |
              destination.zone := Vendor.event.nozomi.zone_dst;
  
            * |
              destination.zone := destination.zone
          }
  
        // Network
        | network.protocol := Vendor.event.network.protocol
        | network.transport := Vendor.event.network.transport
  
        | case {
            network.transport = * |
              network.transport := network.transport;
  
            Vendor.event.nozomi.transport_protocol = * |
              network.transport := Vendor.event.nozomi.transport_protocol;
  
            * |
              network.transport := network.transport
          }
  
        | lower(network.protocol)
        | lower(network.transport)
  
        // Threat / MITRE if present
        | threat.technique.id[0] := Vendor.event.threat.technique.id[0]
        | threat.technique.name[0] := Vendor.event.threat.technique.name[0]
        | threat.tactic.name[0] := Vendor.event.threat.tactic.name[0]
  
        // Nozomi alert fields
        | Vendor.entity_type := "alert"
        | Vendor.alert_id := Vendor.event.nozomi.id
        | Vendor.ack := Vendor.event.nozomi.ack
        | Vendor.alert_name := Vendor.event.nozomi.name
        | Vendor.status := Vendor.event.nozomi.status
        | Vendor.severity := Vendor.event.nozomi.severity
        | Vendor.risk := Vendor.event.nozomi.risk
        | Vendor.type_id := Vendor.event.nozomi.type_id
        | Vendor.type_name := Vendor.event.nozomi.type_name
        | Vendor.is_security := Vendor.event.nozomi.is_security
        | Vendor.is_incident := Vendor.event.nozomi.is_incident
        | Vendor.description := Vendor.event.nozomi.description
        | Vendor.bpf_filter := Vendor.event.nozomi.bpf_filter
        | Vendor.appliance_host := Vendor.event.nozomi.appliance_host
        | Vendor.capture_device := Vendor.event.nozomi.capture_device
        | Vendor.time := Vendor.event.nozomi.time
        | Vendor.created_time := Vendor.event.nozomi.created_time
        | Vendor.closed_time := Vendor.event.nozomi.closed_time
        | Vendor.record_created_at := Vendor.event.nozomi.record_created_at
        | Vendor.record_updated_at := Vendor.event.nozomi.record_updated_at
        | Vendor.id_src := Vendor.event.nozomi.id_src
        | Vendor.id_dst := Vendor.event.nozomi.id_dst
        | Vendor.zone_src := Vendor.event.nozomi.zone_src
        | Vendor.zone_dst := Vendor.event.nozomi.zone_dst
        | Vendor.src_roles := Vendor.event.nozomi.src_roles
        | Vendor.dst_roles := Vendor.event.nozomi.dst_roles;
  
      * |
        event.dataset := event.dataset
    }
  
  
  // ============================================================================
  // ASSETS
  // ============================================================================
  
  | case {
      event.dataset = "nozomi.asset" |
  
        event.kind := "state"
        | event.category[0] := "host"
        | event.type[0] := "info"
  
        // Host
        | host.id := Vendor.event.nozomi.id
        | host.name := Vendor.event.host.name
        | host.ip[0] := Vendor.event.host.ip[0]
        | host.mac[0] := Vendor.event.host.mac[0]
        | host.type := Vendor.event.host.type
  
        // Device enrichment
        | device.manufacturer := Vendor.event.device.manufacturer
        | device.model := Vendor.event.device.model
        | device.serial_number := Vendor.event.device.serial_number
        | device.firmware_version := Vendor.event.device.firmware_version
  
        // Fallbacks from raw Nozomi fields
        | case {
            device.manufacturer = * |
              device.manufacturer := device.manufacturer;
  
            Vendor.event.nozomi.vendor = * |
              device.manufacturer := Vendor.event.nozomi.vendor;
  
            Vendor.event.nozomi.mac_vendor[0] = * |
              device.manufacturer := Vendor.event.nozomi.mac_vendor[0];
  
            * |
              device.manufacturer := device.manufacturer
          }
  
        | case {
            device.model = * |
              device.model := device.model;
  
            Vendor.event.nozomi.product_name = * |
              device.model := Vendor.event.nozomi.product_name;
  
            * |
              device.model := device.model
          }
  
        // Network
        | network.zone[0] := Vendor.event.nozomi.zones[0]
        | network.protocol[0] := Vendor.event.nozomi.protocols[0]
  
        // Labels/tags
        | tags[0] := Vendor.event.nozomi.tags[0]
        | tags[1] := Vendor.event.nozomi.tags[1]
  
        // Nozomi asset fields
        | Vendor.entity_type := "asset"
        | Vendor.asset_id := Vendor.event.nozomi.id
        | Vendor.asset_name := Vendor.event.nozomi.name
        | Vendor.asset_type := Vendor.event.nozomi.type
        | Vendor.technology_category := Vendor.event.nozomi.technology_category
        | Vendor.risk := Vendor.event.nozomi.risk
        | Vendor.lifecycle := Vendor.event.nozomi.lifecycle
        | Vendor.capture_device := Vendor.event.nozomi.capture_device
        | Vendor.created_at := Vendor.event.nozomi.created_at
        | Vendor.updated_at := Vendor.event.nozomi.updated_at
        | Vendor.record_created_at := Vendor.event.nozomi.record_created_at
        | Vendor.last_activity_time := Vendor.event.nozomi.last_activity_time
        | Vendor.appliance_host := Vendor.event.nozomi.appliance_hosts[0]
        | Vendor.roles[0] := Vendor.event.nozomi.roles[0]
        | Vendor.protocols[0] := Vendor.event.nozomi.protocols[0]
        | Vendor.zones[0] := Vendor.event.nozomi.zones[0];
  
      * |
        event.dataset := event.dataset
    }
  
  
  // ============================================================================
  // NODES
  // ============================================================================
  
  | case {
      event.dataset = "nozomi.node" |
  
        event.kind := "state"
        | event.category[0] := "host"
        | event.type[0] := "info"
  
        // Host
        | host.id := Vendor.event.nozomi.id
        | host.name := Vendor.event.host.name
        | host.ip[0] := Vendor.event.host.ip[0]
        | host.mac[0] := Vendor.event.host.mac[0]
        | host.type := Vendor.event.host.type
  
        // Device fallback
        | device.manufacturer := Vendor.event.device.manufacturer
  
        | case {
            device.manufacturer = * |
              device.manufacturer := device.manufacturer;
  
            Vendor.event.nozomi.vendor = * |
              device.manufacturer := Vendor.event.nozomi.vendor;
  
            Vendor.event.nozomi.mac_vendor = * |
              device.manufacturer := Vendor.event.nozomi.mac_vendor;
  
            * |
              device.manufacturer := device.manufacturer
          }
  
        | device.model := Vendor.event.device.model
        | device.serial_number := Vendor.event.device.serial_number
        | device.firmware_version := Vendor.event.device.firmware_version
  
        // Network
        | network.zone := Vendor.event.network.zone
        | network.protocol[0] := Vendor.event.network.protocols[0]
  
        // Nozomi node fields
        | Vendor.entity_type := "node"
        | Vendor.node_id := Vendor.event.nozomi.id
        | Vendor.uid := Vendor.event.nozomi.uid
        | Vendor.node_name := Vendor.event.nozomi.name
        | Vendor.node_ip := Vendor.event.nozomi.ip
        | Vendor.node_type := Vendor.event.nozomi.type
        | Vendor.zone := Vendor.event.nozomi.zone
        | Vendor.roles[0] := Vendor.event.nozomi.roles[0]
        | Vendor.protocols[0] := Vendor.event.nozomi.protocols[0]
        | Vendor.mac_address := Vendor.event.nozomi.mac_address
        | Vendor.mac_vendor := Vendor.event.nozomi.mac_vendor
        | Vendor.is_public := Vendor.event.nozomi.is_public
        | Vendor.is_learned := Vendor.event.nozomi.is_learned
        | Vendor.capture_device := Vendor.event.nozomi.capture_device
        | Vendor.appliance_host := Vendor.event.nozomi.appliance_hosts[0]
        | Vendor.first_activity_time := Vendor.event.nozomi.first_activity_time
        | Vendor.last_activity_time := Vendor.event.nozomi.last_activity_time
        | Vendor.record_created_at := Vendor.event.nozomi.record_created_at;
  
      * |
        event.dataset := event.dataset
    }
  
  
  // ============================================================================
  // VULNERABILITIES
  // ============================================================================
  
  | case {
      event.dataset = "nozomi.vulnerability" |
  
        event.kind := "state"
        | event.category[0] := "vulnerability"
        | event.type[0] := "info"
  
        // Vulnerability
        | vulnerability.id := Vendor.event.vulnerability.id
        | vulnerability.score.base := Vendor.event.vulnerability.score.base
        | vulnerability.severity := Vendor.event.vulnerability.severity
        | vulnerability.description := Vendor.event.vulnerability.description
        | vulnerability.category := Vendor.event.vulnerability.category
        | vulnerability.reference[0] := Vendor.event.vulnerability.reference[0]
  
        // Fallbacks from raw Nozomi fields
        | case {
            vulnerability.id = * |
              vulnerability.id := vulnerability.id;
  
            Vendor.event.nozomi.cve = * |
              vulnerability.id := Vendor.event.nozomi.cve;
  
            * |
              vulnerability.id := vulnerability.id
          }
  
        | case {
            vulnerability.description = * |
              vulnerability.description := vulnerability.description;
  
            Vendor.event.nozomi.summary = * |
              vulnerability.description := Vendor.event.nozomi.summary;
  
            * |
              vulnerability.description := vulnerability.description
          }
  
        | case {
            vulnerability.category = * |
              vulnerability.category := vulnerability.category;
  
            Vendor.event.nozomi.category = * |
              vulnerability.category := Vendor.event.nozomi.category;
  
            * |
              vulnerability.category := vulnerability.category
          }
  
        | case {
            vulnerability.score.base = * |
              vulnerability.score.base := vulnerability.score.base;
  
            Vendor.event.nozomi.score = * |
              vulnerability.score.base := Vendor.event.nozomi.score;
  
            * |
              vulnerability.score.base := vulnerability.score.base
          }
  
        // Host/related
        | host.ip[0] := Vendor.event.host.ip[0]
        | related.ip[0] := Vendor.event.related.ip[0]
  
        | case {
            host.ip[0] = * |
              host.ip[0] := host.ip[0];
  
            Vendor.event.nozomi.nodes[0] = * |
              host.ip[0] := Vendor.event.nozomi.nodes[0];
  
            * |
              host.ip[0] := host.ip[0]
          }
  
        | case {
            related.ip[0] = * |
              related.ip[0] := related.ip[0];
  
            Vendor.event.nozomi.nodes[0] = * |
              related.ip[0] := Vendor.event.nozomi.nodes[0];
  
            * |
              related.ip[0] := related.ip[0]
          }
  
        // Nozomi vulnerability fields
        | Vendor.entity_type := "vulnerability"
        | Vendor.vulnerability_id := Vendor.event.nozomi.id
        | Vendor.cve := Vendor.event.nozomi.cve
        | Vendor.probability := Vendor.event.nozomi.probability
        | Vendor.score := Vendor.event.nozomi.score
        | Vendor.status := Vendor.event.nozomi.status
        | Vendor.closed_time := Vendor.event.nozomi.closed_time
        | Vendor.likelihood := Vendor.event.nozomi.likelihood
        | Vendor.summary := Vendor.event.nozomi.summary
        | Vendor.category := Vendor.event.nozomi.category
        | Vendor.time := Vendor.event.nozomi.time
        | Vendor.node_ip := Vendor.event.nozomi.nodes[0];
  
      * |
        event.dataset := event.dataset
    }
  
  
  // ============================================================================
  // RELATED FIELDS
  // ============================================================================
  
  | case {
      event.dataset = "nozomi.alert" |
        related.ip[0] := source.ip
        | related.ip[1] := destination.ip
        | related.hosts[0] := observer.hostname;
  
      event.dataset = "nozomi.asset" |
        related.ip[0] := host.ip[0]
        | related.hosts[0] := host.name;
  
      event.dataset = "nozomi.node" |
        related.ip[0] := host.ip[0]
        | related.hosts[0] := host.name;
  
      event.dataset = "nozomi.vulnerability" |
        related.ip[0] := host.ip[0];
  
      * |
        Vendor.parser_note := "unknown_dataset"
    }
  
  
  // ============================================================================
  // POST NORMALIZATION
  // ============================================================================
  
  // Useful searchable message
  | case {
      event.dataset = "nozomi.alert" |
        message := rule.description;
  
      event.dataset = "nozomi.asset" |
        message := host.name;
  
      event.dataset = "nozomi.node" |
        message := host.name;
  
      event.dataset = "nozomi.vulnerability" |
        message := vulnerability.description;
  
      * |
        message := event.dataset
    }
tagFields:
- Cps.version
- Vendor
- ecs.version
- event.dataset
- event.kind
- event.module
- event.outcome
- observer.type
